name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'public/**'
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Sync web assets (public -> assets)
        run: |
          cp public/index.html android-app/app/src/main/assets/
          cp public/style.css  android-app/app/src/main/assets/
          cp public/app.js     android-app/app/src/main/assets/

      - name: Build APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-article-app-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
