plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ds.articleeditor'
    compileSdk 34

    defaultConfig {
        applicationId "com.ds.articleeditor"
        minSdk 24
        targetSdk 34
        versionCode 25
        versionName "1.31"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
